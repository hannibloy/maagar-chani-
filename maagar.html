      <div style="text-align:center;padding:22px 8px 4px">
        <h1 class="hero__title" style="font-size:clamp(1.35rem,4.6vw,1.9rem)">המאגר</h1>

      <div class="bar">

          <button class="btn-home" type="button" id="home" title="איפוס" aria-label="איפוס החיפוש">⌂</button>

          <select id="f-domain" aria-label="סינון לפי תחום"><option value="">כל התחומים</option></select>
          <select id="f-aud" aria-label="סינון לפי קהל יעד"><option value="">כל הקהלים</option></select>
          <select id="f-plat" aria-label="סינון לפי פלטפורמה"><option value="">כל הפלטפורמות</option></select>
        </div>

        <div class="chips" id="chips"></div>

        <div class="bar__count">
          <span id="count" role="status" aria-live="polite"></span>
          <button class="link-clear" type="button" id="clear" hidden>ניקוי חיפוש</button>
        </div>
      </div>

      <div class="main" id="main">
        <div class="state-loading"><div class="spinner"></div>טוען את המאגר…</div>
